name: PR Governance

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  policy-gates:
    name: Policy Gates
    runs-on: ubuntu-latest

    steps:
      - name: Enforce draft on open/reopen
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        run: |
          if [ "${{ github.event.pull_request.draft }}" != "true" ]; then
            echo "::error::PRs must be opened as Draft first."
            exit 1
          fi

      - name: Validate branch naming convention
        id: branch_check
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" =~ ^(feature|fix|chore|docs|refactor|test)/([0-9]+)-[a-z0-9._-]+$ ]]; then
            ISSUE="${BASH_REMATCH[2]}"
            echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
            echo "Branch maps to issue #$ISSUE"
          else
            echo "::error::Branch must match <type>/<issue-number>-<slug>, for example feature/14-fastapi-health-endpoint"
            exit 1
          fi

      - name: Verify issue exists and is tied to feature track milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ISSUE="${{ steps.branch_check.outputs.issue_number }}"
          REPO="${{ github.repository }}"

          STATE=$(gh api "repos/$REPO/issues/$ISSUE" --jq '.state' 2>/dev/null || true)
          if [ -z "$STATE" ]; then
            echo "::error::Issue #$ISSUE does not exist in $REPO"
            exit 1
          fi

          MILESTONE_TITLE=$(gh api "repos/$REPO/issues/$ISSUE" --jq '.milestone.title // empty')
          HAS_TRACK_LABEL=$(gh api "repos/$REPO/issues/$ISSUE" --jq '[.labels[].name] | index("project:feature-track") != null')

          echo "Issue #$ISSUE found with state: $STATE"

          if [ -z "$MILESTONE_TITLE" ]; then
            echo "::error::Issue #$ISSUE must be assigned to a milestone in the Price Optimization Model Feature Track."
            exit 1
          fi

          if [ "$HAS_TRACK_LABEL" != "true" ]; then
            echo "::error::Issue #$ISSUE must include the label 'project:feature-track'."
            exit 1
          fi

      - name: Enforce PR project label and milestone
        shell: bash
        run: |
          BODY_FILE="pr_metadata_check.txt"
          printf "%s" "${{ toJson(github.event.pull_request.labels.*.name) }}" > "$BODY_FILE"

          if ! grep -Eiq 'project:feature-track' "$BODY_FILE"; then
            echo "::error::PR must include the label 'project:feature-track'."
            exit 1
          fi

          if [ -z "${{ github.event.pull_request.milestone.title }}" ]; then
            echo "::error::PR must be assigned to a milestone."
            exit 1
          fi

      - name: Ensure PR body links matching issue
        shell: bash
        run: |
          ISSUE="#${{ steps.branch_check.outputs.issue_number }}"
          BODY_FILE="pr_body.txt"
          printf "%s" "${{ github.event.pull_request.body }}" > "$BODY_FILE"

          if ! grep -Eiq "(closes|fixes|resolves)[[:space:]]+$ISSUE" "$BODY_FILE"; then
            echo "::error::PR body must include one of: Closes $ISSUE, Fixes $ISSUE, or Resolves $ISSUE"
            exit 1
          fi

      - name: Ensure milestone line is not empty in PR template
        shell: bash
        run: |
          BODY_FILE="pr_body_milestone.txt"
          printf "%s" "${{ github.event.pull_request.body }}" > "$BODY_FILE"

          if ! grep -Eiq "Milestone:[[:space:]]+Milestone[[:space:]]+[1-8]" "$BODY_FILE"; then
            echo "::warning::Could not verify milestone declaration format in PR body. Ensure Milestone is filled in the template."
          fi
