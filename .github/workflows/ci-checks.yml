name: CI Checks

on:
  pull_request:
  push:
    branches-ignore:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA=""
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi

          git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" > changed_files.txt
          echo "Changed file count: $(wc -l < changed_files.txt)"

      - name: Ensure data directories are not modified in changes
        shell: bash
        run: |
          if grep -Eiq '^(data|Data)/' changed_files.txt; then
            echo "::error::Changes under data/Data directories are blocked. Keep datasets out of version control."
            grep -Ein '^(data|Data)/' changed_files.txt || true
            exit 1
          fi
          echo "No data directory changes detected."

      - name: Check for large changed files (>5 MB)
        shell: bash
        run: |
          LIMIT=$((5 * 1024 * 1024))
          LARGE_FOUND=0
          while IFS= read -r FILE; do
            if [ -f "$FILE" ]; then
              SIZE=$(wc -c < "$FILE")
              if [ "$SIZE" -gt "$LIMIT" ]; then
                echo "::error::Large tracked file detected: $FILE ($SIZE bytes)"
                LARGE_FOUND=1
              fi
            fi
          done < changed_files.txt

          if [ "$LARGE_FOUND" -ne 0 ]; then
            exit 1
          fi

  python-sanity:
    name: Python Sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources if present
        shell: bash
        run: |
          TARGETS=()
          [ -d src ] && TARGETS+=(src)
          [ -d Src ] && TARGETS+=(Src)

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "No source directory found (src/ or Src/). Skipping compile check."
            exit 0
          fi

          python -m compileall "${TARGETS[@]}"

      - name: Install test dependencies when requirements exists
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt || true
          fi
          python -m pip install pytest

      - name: Run pytest when tests exist
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            python -m pytest tests -q
            exit $?
          fi

          if compgen -G "Test/test_*.py" > /dev/null; then
            python -m pytest Test -q
            exit $?
          fi

          echo "No pytest-discoverable tests found in tests/ or Test/. Skipping test run."

