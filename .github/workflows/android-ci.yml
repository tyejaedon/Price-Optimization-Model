name: Android CI

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "app/**"
  workflow_dispatch:

# Android build/lint/style/unit-test quality gate (issue #141, Milestone 13), run alongside the
# existing Policy Gates / Repository Integrity / Python Sanity checks in ci-checks.yml and
# pr-governance.yml. Does not require committing the Gradle wrapper jar: gradle/actions/setup-gradle
# provisions a pinned Gradle distribution and invokes `gradle` directly.
jobs:
  android-build-and-test:
    name: Gradle build, lint, ktlint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ktlint style check
        run: gradle :app:ktlintCheck --console=plain

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Android Lint
        run: gradle :app:lintDebug --console=plain

      - name: Unit tests (ViewModel/state + repository)
        run: gradle :app:testDebugUnitTest --console=plain

      - name: Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --console=plain

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          path: |
            app/build/reports/
          retention-days: 7
