name: Android CI

on:
  pull_request:
    paths:
      - "design-system/**"
      - "app/**"
      - "admin-app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  push:
    branches: [master]
    paths:
      - "design-system/**"
      - "app/**"
      - "admin-app/**"
  workflow_dispatch:

jobs:
  android-static-and-unit:
    name: Gradle build, lint, ktlint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ktlint style check
        run: gradle :design-system:ktlintCheck :app:ktlintCheck :admin-app:ktlintCheck --console=plain

      - name: Assemble debug APKs
        run: gradle :app:assembleDebug :admin-app:assembleDebug --console=plain

      - name: Android Lint
        run: gradle :design-system:lintDebug :app:lintDebug :admin-app:lintDebug --console=plain

      - name: Unit tests (ViewModel/state + repository)
        run: gradle :app:testDebugUnitTest :admin-app:testDebugUnitTest --console=plain

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-static-reports
          path: |
            app/build/reports/
            admin-app/build/reports/
          retention-days: 7
