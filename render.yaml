services:
  - type: web
    name: price-optimization-service
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -m nltk.downloader -q -d /opt/render/project/nltk_data stopwords wordnet
    startCommand: uvicorn src.api.hosted:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: NLTK_DATA
        value: /opt/render/project/nltk_data
      - key: PRICING_ARTIFACT_DIR
        value: artifacts
      - key: PRICING_TARIFF_CSV
        value: config/tariffs/mpesa_p2p_users_2026-08-04.csv
      - key: PRICING_TARIFF_SHA256
        value: 4390d9d5ec920c68000da8562c140e7477a0afac22ad41c8a2fa23227761e882
      - key: PRICING_ARTIFACT_MANIFEST_SHA256
        value: 568edb5c088564fd637de052d51eeaa902ab6c759d29eb10251fdc6880920226
      - key: SEED_PLATFORM_MENTORS
        value: "true"
      - key: PLATFORM_PRICE_KEY
        sync: false
      - key: MLOPS_ADMIN_TOKEN
        generateValue: true
