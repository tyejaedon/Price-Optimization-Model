org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Issue #146: Kotlin 1.9.24's embedded compiler cannot run on JDK 25+ (it crashes the Kotlin
# daemon with "IllegalArgumentException: 25.0.3" trying to parse the JVM version string). The
# app's Kotlin toolchain is pinned to 17 (app/build.gradle.kts `kotlin { jvmToolchain(17) }`); the
# settings below let Gradle auto-detect/auto-provision a compatible JDK for that toolchain even
# when the Gradle daemon itself is launched by a newer JDK (e.g. an IDE-bundled JDK 25). This is
# the default Gradle behavior; it is declared explicitly so it cannot be silently disabled.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

