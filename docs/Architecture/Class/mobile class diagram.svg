<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 985" width="1300" height="985" style="background:#FFFFFF; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Strong High-Contrast Shadow -->
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.10" flood-color="#0F172A"/>
    </filter>

    <!-- Heavy UML Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1D4ED8"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6D28D9"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B45309"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0F766E"/>
    </marker>

    <!-- Solid Diamond (Composition) -->
    <marker id="uml-comp" viewBox="0 0 14 14" refX="1" refY="7" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <polygon points="1 7, 7 2, 13 7, 7 12" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title Banner (Full Width) -->
  <rect x="15" y="12" width="1270" height="52" rx="8" fill="#0F172A" />
  <text x="35" y="45" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="0.4">Figure 4.4: Client Presentation Layer Class Diagram</text>
  <text x="880" y="44" fill="#94A3B8" font-size="15" font-weight="600">Modern Android Architecture (MVVM &amp; Clean Repo)</text>

  <!-- ==================== TOP ROW: PRESENTATION & MVVM ==================== -->
  
  <!-- 1. PricingScreen (Composable View) -->
  <!-- X: 15, Width: 385, Y: 78, Height: 365 -->
  <g filter="url(#card-shadow)">
    <rect x="15" y="78" width="385" height="365" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2.2" />
    <path d="M 15 78 L 400 78 L 400 135 L 15 135 Z" fill="#F1F5F9" rx="10" />
    <rect x="15" y="125" width="385" height="10" fill="#F1F5F9" />
    <line x1="15" y1="135" x2="400" y2="135" stroke="#475569" stroke-width="2" />
    <text x="207" y="105" fill="#475569" font-size="14" font-weight="600" font-style="italic" text-anchor="middle">&lt;&lt;Composable UI View&gt;&gt;</text>
    <text x="207" y="127" fill="#0F172A" font-size="20" font-weight="800" text-anchor="middle">PricingScreen</text>
    
    <!-- Attributes -->
    <text x="32" y="162" fill="#0F172A" font-size="16" font-weight="700">+ viewModel: PricingViewModel</text>
    <text x="32" y="186" fill="#0F172A" font-size="16" font-weight="700">+ onSignOut: () -&gt; Unit</text>
    <line x1="15" y1="200" x2="400" y2="200" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Methods -->
    <text x="32" y="224" fill="#0F172A" font-size="15" font-weight="600">+ PricingContent(uiState, onEvent)</text>
    <text x="32" y="248" fill="#0F172A" font-size="15" font-weight="600">+ PricingFormCard(formState)</text>
    <text x="32" y="272" fill="#0F172A" font-size="15" font-weight="600">+ PricingResultCard(predictionResult)</text>
    <text x="32" y="296" fill="#0F172A" font-size="15" font-weight="600">+ PeerScatterPlot(peerMatches)</text>
    <text x="32" y="320" fill="#0F172A" font-size="15" font-weight="600">+ MPesaTariffBreakdown(tariffFee)</text>
    <text x="32" y="344" fill="#0F172A" font-size="15" font-weight="600">+ ErrorDialog(message, onRetry)</text>
    <text x="32" y="368" fill="#0F172A" font-size="15" font-weight="600">+ SignOutConfirmationDialog()</text>
    
    <!-- Footer Tag -->
    <rect x="25" y="398" width="365" height="34" rx="6" fill="#F1F5F9" />
    <text x="207" y="420" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">Declarative UI Layer • Zero Persistent State</text>
  </g>

  <!-- 2. PricingViewModel (State Holder) -->
  <!-- X: 440, Width: 420, Y: 78, Height: 365 -->
  <g filter="url(#card-shadow)">
    <rect x="440" y="78" width="420" height="365" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5" />
    <path d="M 440 78 L 860 78 L 860 135 L 440 135 Z" fill="#EFF6FF" rx="10" />
    <rect x="440" y="125" width="420" height="10" fill="#EFF6FF" />
    <line x1="440" y1="135" x2="860" y2="135" stroke="#2563EB" stroke-width="2" />
    <text x="650" y="105" fill="#1D4ED8" font-size="14" font-weight="600" font-style="italic" text-anchor="middle">&lt;&lt;State Holder / ViewModel&gt;&gt;</text>
    <text x="650" y="127" fill="#1E3A8A" font-size="20" font-weight="800" text-anchor="middle">PricingViewModel : ViewModel</text>
    
    <!-- Attributes -->
    <text x="455" y="162" fill="#0F172A" font-size="15" font-weight="700">- repository: IPricingRepository</text>
    <text x="455" y="186" fill="#0F172A" font-size="15" font-weight="700">- _uiState: MutableStateFlow&lt;PricingUiState&gt;</text>
    <text x="455" y="210" fill="#0F172A" font-size="15" font-weight="700">+ uiState: StateFlow&lt;PricingUiState&gt;</text>
    <line x1="440" y1="222" x2="860" y2="222" stroke="#DBEAFE" stroke-width="1.5" />
    
    <!-- Methods -->
    <text x="455" y="244" fill="#0F172A" font-size="15" font-weight="600">+ onDescriptionChanged(text: String)</text>
    <text x="455" y="266" fill="#0F172A" font-size="15" font-weight="600">+ onMentorIdChanged(mentorId: String)</text>
    <text x="455" y="288" fill="#0F172A" font-size="15" font-weight="600">+ onIndustrySelected(industry: String)</text>
    <text x="455" y="310" fill="#0F172A" font-size="15" font-weight="600">+ onMentorCountrySelected(iso2: String)</text>
    <text x="455" y="332" fill="#0F172A" font-size="15" font-weight="600">+ onClientCountrySelected(iso2: String)</text>
    <text x="455" y="354" fill="#0F172A" font-size="15" font-weight="600">+ onCompetitivenessChanged(score: Float)</text>
    <text x="455" y="378" fill="#1D4ED8" font-size="16" font-weight="800">+ calculateOptimalPrice()</text>
    
    <!-- Footer Tag -->
    <rect x="450" y="398" width="400" height="34" rx="6" fill="#EFF6FF" />
    <text x="650" y="420" fill="#1D4ED8" font-size="14" font-weight="700" text-anchor="middle">Dispatches Coroutine on viewModelScope</text>
  </g>

  <!-- 3. PricingUiState (State Sealed Interface & Form State) -->
  <!-- X: 900, Width: 385, Y: 78, Height: 365 -->
  <g filter="url(#card-shadow)">
    <rect x="900" y="78" width="385" height="365" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2.2" />
    <path d="M 900 78 L 1285 78 L 1285 135 L 900 135 Z" fill="#F5F3FF" rx="10" />
    <rect x="900" y="125" width="385" height="10" fill="#F5F3FF" />
    <line x1="900" y1="135" x2="1285" y2="135" stroke="#6D28D9" stroke-width="2" />
    <text x="1092" y="105" fill="#6D28D9" font-size="14" font-weight="600" font-style="italic" text-anchor="middle">&lt;&lt;Sealed Interface / State Pattern&gt;&gt;</text>
    <text x="1092" y="127" fill="#4C1D95" font-size="20" font-weight="800" text-anchor="middle">PricingUiState</text>
    
    <!-- State Subtypes -->
    <text x="915" y="160" fill="#4C1D95" font-size="15" font-weight="800">+ Idle(formState: PricingFormState)</text>
    <text x="915" y="182" fill="#4C1D95" font-size="15" font-weight="800">+ Loading(formState: PricingFormState)</text>
    <text x="915" y="204" fill="#4C1D95" font-size="15" font-weight="800">+ Success(result: PredictionResultDTO)</text>
    <text x="915" y="226" fill="#4C1D95" font-size="15" font-weight="800">+ Error(message: String, formState)</text>
    <line x1="900" y1="238" x2="1285" y2="238" stroke="#EDE9FE" stroke-width="1.8" />
    
    <!-- PricingFormState Box Details -->
    <text x="915" y="260" fill="#0F172A" font-size="15" font-weight="700">&lt;&lt;data class&gt;&gt; PricingFormState</text>
    <text x="915" y="282" fill="#334155" font-size="14" font-weight="600">+ rawDescription: String (min 40)</text>
    <text x="915" y="302" fill="#334155" font-size="14" font-weight="600">+ mentorId, selectedIndustry: String</text>
    <text x="915" y="322" fill="#334155" font-size="14" font-weight="600">+ mentorCountry, clientCountry: String</text>
    <text x="915" y="342" fill="#334155" font-size="14" font-weight="600">+ competitivenessScore: Float = 0.5f</text>
    <text x="915" y="366" fill="#047857" font-size="15" font-weight="800">+ isFormValid(): Boolean</text>
    
    <!-- Footer Tag -->
    <rect x="910" y="398" width="365" height="34" rx="6" fill="#F5F3FF" />
    <text x="1092" y="420" fill="#6D28D9" font-size="14" font-weight="700" text-anchor="middle">Preserves Form Input Across Screen States</text>
  </g>

  <!-- ==================== MIDDLE CONNECTIONS & EXTRA-SPACIOUS DEPENDENCY CONTAINER ==================== -->
  
  <!-- Horizontal 1: PricingScreen -> PricingViewModel (binds) -->
  <line x1="400" y1="250" x2="440" y2="250" stroke="#1D4ED8" stroke-width="3" marker-end="url(#arr-blue)" />
  <rect x="388" y="214" width="64" height="24" rx="4" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.8" />
  <text x="420" y="231" fill="#1D4ED8" font-size="12" font-weight="800" text-anchor="middle">binds</text>

  <!-- Horizontal 2: PricingViewModel -> PricingUiState (emits) -->
  <line x1="860" y1="250" x2="900" y2="250" stroke="#6D28D9" stroke-width="3" marker-end="url(#arr-purple)" marker-start="url(#uml-comp)" />
  <rect x="852" y="214" width="56" height="24" rx="4" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.8" />
  <text x="880" y="231" fill="#6D28D9" font-size="12" font-weight="800" text-anchor="middle">emits</text>

  <!-- Vertical: PricingViewModel -> IPricingRepository (MASSIVE 107px GAP: Y=443 to Y=550) -->
  <line x1="650" y1="443" x2="650" y2="550" stroke="#047857" stroke-width="3.5" marker-end="url(#arr-green)" />
  
  <!-- Generously Sized Container (Width 320px, Height 42px) with ample padding and sharp text -->
  <rect x="490" y="475" width="320" height="42" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2.5" filter="url(#card-shadow)" />
  <text x="650" y="502" fill="#047857" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="0.2">depends on IPricingRepository</text>

  <!-- ==================== BOTTOM ROW: DOMAIN & DATA TIER (Y: 550 to 955) ==================== -->

  <!-- 4. PricingApiService & Wire DTOs -->
  <!-- X: 15, Width: 385, Y: 550, Height: 405 -->
  <g filter="url(#card-shadow)">
    <rect x="15" y="550" width="385" height="405" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.2" />
    <path d="M 15 550 L 400 550 L 400 607 L 15 607 Z" fill="#F0FDFA" rx="10" />
    <rect x="15" y="597" width="385" height="10" fill="#F0FDFA" />
    <line x1="15" y1="607" x2="400" y2="607" stroke="#0D9488" stroke-width="2" />
    <text x="207" y="577" fill="#0D9488" font-size="14" font-weight="600" font-style="italic" text-anchor="middle">&lt;&lt;Retrofit REST Interface&gt;&gt;</text>
    <text x="207" y="599" fill="#134E4A" font-size="20" font-weight="800" text-anchor="middle">PricingApiService</text>
    
    <!-- Endpoints -->
    <text x="32" y="633" fill="#0F766E" font-size="14" font-weight="800">@POST("api/v1/optimize-price")</text>
    <text x="32" y="655" fill="#0F172A" font-size="15" font-weight="700">+ requestPriceOptimization(</text>
    <text x="50" y="677" fill="#475569" font-size="14" font-weight="600">@Header("Authorization") token: String,</text>
    <text x="50" y="699" fill="#475569" font-size="14" font-weight="600">@Body payload: PricingQueryDTO</text>
    <text x="32" y="721" fill="#0F172A" font-size="15" font-weight="700">): PredictionResultDTO</text>
    
    <text x="32" y="749" fill="#0F766E" font-size="14" font-weight="800">@GET("health")</text>
    <text x="32" y="771" fill="#0F172A" font-size="15" font-weight="700">+ fetchHealth(): HealthStatusDTO</text>
    <line x1="15" y1="785" x2="400" y2="785" stroke="#CCFBF1" stroke-width="1.5" />
    
    <!-- Wire DTO Summary -->
    <text x="32" y="811" fill="#134E4A" font-size="15" font-weight="800">&lt;&lt;Canonical Network DTOs&gt;&gt;</text>
    <text x="32" y="835" fill="#334155" font-size="14" font-weight="600">• PricingQueryDTO (bio, domain, countries)</text>
    <text x="32" y="859" fill="#334155" font-size="14" font-weight="600">• PredictionResultDTO (rate, corridor, fee)</text>
    <text x="32" y="883" fill="#334155" font-size="14" font-weight="600">• PeerMatchDTO (listingId, rate, distance)</text>
    
    <!-- Footer Tag -->
    <rect x="25" y="910" width="365" height="34" rx="6" fill="#F0FDFA" />
    <text x="207" y="932" fill="#0F766E" font-size="14" font-weight="700" text-anchor="middle">Network Boundary • Contract Mirrors Python ASGI</text>
  </g>

  <!-- 5. IPricingRepository & PricingRepositoryImpl -->
  <!-- X: 440, Width: 420, Y: 550, Height: 405 -->
  <g filter="url(#card-shadow)">
    <rect x="440" y="550" width="420" height="405" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2.5" />
    <path d="M 440 550 L 860 550 L 860 607 L 440 607 Z" fill="#ECFDF5" rx="10" />
    <rect x="440" y="597" width="420" height="10" fill="#ECFDF5" />
    <line x1="440" y1="607" x2="860" y2="607" stroke="#059669" stroke-width="2" />
    <text x="650" y="577" fill="#059669" font-size="14" font-weight="600" font-style="italic" text-anchor="middle">&lt;&lt;Domain Repository &amp; Implementation&gt;&gt;</text>
    <text x="650" y="599" fill="#064E3B" font-size="20" font-weight="800" text-anchor="middle">PricingRepositoryImpl</text>
    
    <!-- Domain Interface Definition -->
    <text x="455" y="633" fill="#059669" font-size="15" font-weight="800">&lt;&lt;interface&gt;&gt; IPricingRepository</text>
    <text x="455" y="657" fill="#0F172A" font-size="15" font-weight="700">+ calculateOptimalRate(query: PricingQueryDTO)</text>
    <text x="475" y="679" fill="#047857" font-size="15" font-weight="700">: PricingOutcome&lt;PredictionResultDTO&gt;</text>
    <line x1="440" y1="693" x2="860" y2="693" stroke="#D1FAE5" stroke-width="1.5" />
    
    <!-- Implementation Members -->
    <text x="455" y="719" fill="#0F172A" font-size="15" font-weight="600">- apiService: PricingApiService</text>
    <text x="455" y="743" fill="#0F172A" font-size="15" font-weight="600">- authManager: IAuthTokenProvider</text>
    <text x="455" y="767" fill="#0F172A" font-size="15" font-weight="600">- ioDispatcher: CoroutineDispatcher = Dispatchers.IO</text>
    <line x1="440" y1="781" x2="860" y2="781" stroke="#D1FAE5" stroke-width="1.5" />
    
    <!-- Method Flow Details -->
    <text x="455" y="807" fill="#064E3B" font-size="15" font-weight="800">+ override calculateOptimalRate(query):</text>
    <text x="470" y="831" fill="#334155" font-size="14" font-weight="600">1. token = authManager.getActiveBearerToken()</text>
    <text x="470" y="853" fill="#334155" font-size="14" font-weight="600">2. res = apiService.requestPriceOptimization(token, query)</text>
    <text x="470" y="875" fill="#334155" font-size="14" font-weight="600">3. return PricingOutcome.Success(res)</text>
    
    <!-- Footer Tag -->
    <rect x="450" y="910" width="400" height="34" rx="6" fill="#ECFDF5" />
    <text x="650" y="932" fill="#059669" font-size="14" font-weight="700" text-anchor="middle">Dispatches on IO Thread • Dependency Inversion</text>
  </g>

  <!-- 6. IAuthTokenProvider & FirebaseAuthManager -->
  <!-- X: 900, Width: 385, Y: 550, Height: 405 -->
  <g filter="url(#card-shadow)">
    <rect x="900" y="550" width="385" height="405" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2.2" />
    <path d="M 900 550 L 1285 550 L 1285 607 L 900 607 Z" fill="#FFFBEB" rx="10" />
    <rect x="900" y="597" width="385" height="10" fill="#FFFBEB" />
    <line x1="900" y1="607" x2="1285" y2="607" stroke="#D97706" stroke-width="2" />
    <text x="1092" y="577" fill="#D97706" font-size="14" font-weight="600" font-style="italic" text-anchor="middle">&lt;&lt;Authentication Provider&gt;&gt;</text>
    <text x="1092" y="599" fill="#78350F" font-size="20" font-weight="800" text-anchor="middle">FirebaseAuthManager</text>
    
    <!-- Interface -->
    <text x="915" y="633" fill="#B45309" font-size="15" font-weight="800">&lt;&lt;interface&gt;&gt; IAuthTokenProvider</text>
    <text x="915" y="657" fill="#0F172A" font-size="15" font-weight="700">+ getActiveBearerToken(): String</text>
    <text x="915" y="681" fill="#0F172A" font-size="15" font-weight="700">+ signIn(email, password): String</text>
    <text x="915" y="705" fill="#0F172A" font-size="15" font-weight="700">+ signOut()</text>
    <line x1="900" y1="719" x2="1285" y2="719" stroke="#FEF3C7" stroke-width="1.5" />
    
    <!-- Concrete Members -->
    <text x="915" y="745" fill="#78350F" font-size="15" font-weight="700">FirebaseAuthManager : IAuthTokenProvider</text>
    <text x="915" y="769" fill="#0F172A" font-size="15" font-weight="600">- firebaseAuth: FirebaseAuth?</text>
    <text x="915" y="793" fill="#0F172A" font-size="15" font-weight="600">- cachedIdToken: String?</text>
    <line x1="900" y1="807" x2="1285" y2="807" stroke="#FEF3C7" stroke-width="1.5" />
    
    <text x="915" y="833" fill="#0F172A" font-size="15" font-weight="700">+ override getActiveBearerToken(): String</text>
    <text x="930" y="857" fill="#475569" font-size="14" font-weight="600">currentUser.getIdToken(false).await()</text>
    <text x="915" y="883" fill="#0F172A" font-size="15" font-weight="700">+ override signIn(email, password): UID</text>
    
    <!-- Footer Tag -->
    <rect x="910" y="910" width="365" height="34" rx="6" fill="#FFFBEB" />
    <text x="1092" y="932" fill="#B45309" font-size="14" font-weight="700" text-anchor="middle">Hardware-Backed Encrypted Storage (JWT)</text>
  </g>

  <!-- Horizontal 3: PricingRepositoryImpl -> PricingApiService (invokes) -->
  <line x1="440" y1="750" x2="400" y2="750" stroke="#0F766E" stroke-width="3" marker-end="url(#arr-teal)" />
  <rect x="390" y="715" width="60" height="24" rx="4" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.8" />
  <text x="420" y="732" fill="#0F766E" font-size="12" font-weight="800" text-anchor="middle">invokes</text>

  <!-- Horizontal 4: PricingRepositoryImpl -> IAuthTokenProvider (queries) -->
  <line x1="860" y1="750" x2="900" y2="750" stroke="#B45309" stroke-width="3" marker-end="url(#arr-amber)" />
  <rect x="850" y="715" width="60" height="24" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" />
  <text x="880" y="732" fill="#B45309" font-size="12" font-weight="800" text-anchor="middle">queries</text>

</svg>
