<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 960" width="1360" height="960" style="background:#FFFFFF; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" flood-color="#0F172A"/>
    </filter>
    <filter id="shadow-actor" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12" flood-color="#1E293B"/>
    </filter>

    <!-- Arrowhead Markers -->
    <marker id="arr-include" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0D9488" />
    </marker>
    <marker id="arr-assoc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="5" cy="5" r="3" fill="#3B82F6" />
    </marker>
    <marker id="arr-assoc-admin" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="5" cy="5" r="3" fill="#7C3AED" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="boundary-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Canvas Outer Background -->
  <rect x="0" y="0" width="1360" height="960" fill="#F8FAFC" />

  <!-- Diagram Title Header -->
  <rect x="30" y="20" width="1300" height="56" rx="8" fill="url(#header-grad)" filter="url(#shadow)"/>
  <text x="50" y="55" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="0.5">Figure 4.1: UML Use Case Diagram — Dynamic Price Optimization Framework</text>
  <text x="1310" y="55" text-anchor="end" fill="#94A3B8" font-size="13" font-weight="600">Strathmore University • Research Dissertation</text>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <!-- Bounding Box -->
  <rect x="230" y="95" width="900" height="840" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
  <!-- Boundary Header Tab -->
  <rect x="230" y="95" width="900" height="42" rx="14" fill="url(#boundary-header)" />
  <rect x="230" y="125" width="900" height="12" fill="url(#boundary-header)" />
  <text x="680" y="122" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="0.5">«System Boundary» AI-Driven Dynamic Price Optimization Platform</text>

  <!-- Boundary Internal Sub-Group Banners -->
  <rect x="250" y="150" width="410" height="30" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="455" y="170" text-anchor="middle" fill="#1E40AF" font-size="13.5" font-weight="700">Mentor Operational &amp; Pricing Use Cases</text>

  <rect x="690" y="150" width="420" height="30" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="900" y="170" text-anchor="middle" fill="#5B21B6" font-size="13.5" font-weight="700">Automated Pipeline &amp; Administrative Management</text>

  <!-- ================= PRIMARY ACTOR: MENTOR ================= -->
  <!-- Stick Figure & Card (Left, X: 35 to 205) -->
  <rect x="35" y="270" width="165" height="280" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow-actor)"/>
  <!-- Stick Figure Icon -->
  <circle cx="117" cy="330" r="24" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
  <circle cx="117" cy="330" r="10" fill="#2563EB"/>
  <line x1="117" y1="354" x2="117" y2="425" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="82" y1="380" x2="152" y2="380" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="117" y1="425" x2="87" y2="480" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="117" y1="425" x2="147" y2="480" stroke="#1D4ED8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Actor Labels -->
  <text x="117" y="512" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="800">Mentor</text>
  <text x="117" y="532" text-anchor="middle" fill="#2563EB" font-size="12.5" font-weight="700">«Primary Actor»</text>
  <!-- Client Interface Badge -->
  <rect x="47" y="565" width="141" height="42" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
  <text x="117" y="582" text-anchor="middle" fill="#1E40AF" font-size="11.5" font-weight="700">Android Mobile Client</text>
  <text x="117" y="597" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">Jetpack Compose UI</text>

  <!-- ================= SECONDARY ACTOR: SYSTEM ADMINISTRATOR ================= -->
  <!-- Stick Figure & Card (Right, X: 1155 to 1325) -->
  <rect x="1155" y="270" width="170" height="280" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow-actor)"/>
  <!-- Stick Figure Icon -->
  <circle cx="1240" cy="330" r="24" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
  <circle cx="1240" cy="330" r="10" fill="#7C3AED"/>
  <line x1="1240" y1="354" x2="1240" y2="425" stroke="#6D28D9" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="1205" y1="380" x2="1275" y2="380" stroke="#6D28D9" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="1240" y1="425" x2="1210" y2="480" stroke="#6D28D9" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="1240" y1="425" x2="1270" y2="480" stroke="#6D28D9" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Actor Labels -->
  <text x="1240" y="512" text-anchor="middle" fill="#0F172A" font-size="15.5" font-weight="800">System Admin</text>
  <text x="1240" y="532" text-anchor="middle" fill="#7C3AED" font-size="12.5" font-weight="700">«Secondary Actor»</text>
  <!-- Admin Interface Badge -->
  <rect x="1165" y="565" width="150" height="42" rx="6" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
  <text x="1240" y="582" text-anchor="middle" fill="#5B21B6" font-size="11.5" font-weight="700">FastAPI ASGI Gateway</text>
  <text x="1240" y="597" text-anchor="middle" fill="#64748B" font-size="11" font-weight="500">Cloud MLOps Console</text>


  <!-- ================= CONNECTOR LINES (ASSOCIATIONS) ================= -->
  <!-- Mentor Associations (from X: 200, Y: 410) -->
  <!-- to UC1: Input Unstructured Service Data (280, 240) -->
  <path d="M 200 390 C 225 390, 240 250, 280 240" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-assoc)"/>
  <!-- to UC2: Input Structured Metadata (280, 360) -->
  <path d="M 200 405 C 235 405, 245 365, 280 360" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-assoc)"/>
  <!-- to UC3: Request Optimal Price Calculation (280, 500) -->
  <path d="M 200 420 C 235 420, 245 490, 280 500" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-assoc)"/>
  <!-- to UC4: View Spatial Market Trend Analyses (280, 780) -->
  <path d="M 200 435 C 220 435, 240 760, 280 775" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-assoc)"/>

  <!-- Admin Associations (from X: 1155, Y: 410) -->
  <!-- to UC5: Manage Firestore Repositories (880, 240) -->
  <path d="M 1155 390 C 1120 390, 1105 250, 1060 240" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-assoc-admin)"/>
  <!-- to UC6: Monitor API Throughput & Latency (880, 360) -->
  <path d="M 1155 405 C 1125 405, 1105 365, 1060 360" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-assoc-admin)"/>
  <!-- to UC7: Trigger Offline Pipeline Retraining (880, 500) -->
  <path d="M 1155 420 C 1125 420, 1105 490, 1060 500" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-assoc-admin)"/>
  <!-- to UC8: Configure Hyperparameter Tuning (880, 780) -->
  <path d="M 1155 435 C 1125 435, 1105 760, 1060 775" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-assoc-admin)"/>


  <!-- ================= INCLUDED USE CASES CONNECTORS («include») ================= -->
  <!-- From UC3 (center X: 450, Y: 535) down to UC3.1, UC3.2, UC3.3 -->
  <!-- To UC3.1: Vectorize Text (550, 610) -->
  <path d="M 450 545 C 470 565, 490 595, 520 610" fill="none" stroke="#0D9488" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr-include)"/>
  <!-- Badge for UC3.1 -->
  <rect x="445" y="572" width="82" height="24" rx="4" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"/>
  <text x="486" y="588" text-anchor="middle" fill="#0D9488" font-size="11.5" font-weight="700">«include»</text>

  <!-- To UC3.2: Predict Rate (550, 690) -->
  <path d="M 420 545 C 430 600, 460 660, 510 685" fill="none" stroke="#0D9488" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr-include)"/>
  <!-- Badge for UC3.2 -->
  <rect x="420" y="625" width="82" height="24" rx="4" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"/>
  <text x="461" y="641" text-anchor="middle" fill="#0D9488" font-size="11.5" font-weight="700">«include»</text>

  <!-- To UC3.3: Evaluate Tariffs (550, 770) -->
  <path d="M 390 545 C 380 640, 420 730, 490 760" fill="none" stroke="#0D9488" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr-include)"/>
  <!-- Badge for UC3.3 -->
  <rect x="375" y="675" width="82" height="24" rx="4" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2"/>
  <text x="416" y="691" text-anchor="middle" fill="#0D9488" font-size="11.5" font-weight="700">«include»</text>


  <!-- ================= MENTOR USE CASES (LEFT SIDE) ================= -->

  <!-- UC1: Input Unstructured Service Data -->
  <g filter="url(#shadow)">
    <rect x="270" y="205" width="350" height="74" rx="37" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="445" y="238" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">UC1: Input Unstructured Service Data</text>
    <text x="445" y="258" text-anchor="middle" fill="#64748B" font-size="12">Natural language bio narratives &amp; core technical skills</text>
  </g>

  <!-- UC2: Input Structured Metadata -->
  <g filter="url(#shadow)">
    <rect x="270" y="325" width="350" height="74" rx="37" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="445" y="358" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">UC2: Input Structured Metadata</text>
    <text x="445" y="378" text-anchor="middle" fill="#64748B" font-size="12">Bilateral corridor (origin/target), industry, saturation</text>
  </g>

  <!-- UC3: Request Optimal Price Calculation (Highlighted Primary Use Case) -->
  <g filter="url(#shadow)">
    <rect x="250" y="455" width="390" height="88" rx="44" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5"/>
    <text x="445" y="492" text-anchor="middle" fill="#1E40AF" font-size="15.5" font-weight="800">UC3: Request Optimal Price Calculation</text>
    <text x="445" y="513" text-anchor="middle" fill="#2563EB" font-size="12.5" font-weight="600">Triggers real-time bilateral spatial ML inference pipeline</text>
  </g>

  <!-- INCLUDED AUTOMATED ALGORITHMIC SUB-USE CASES -->
  <!-- UC3.1: Vectorize Text via TF-IDF & SVD -->
  <g filter="url(#shadow)">
    <rect x="525" y="580" width="345" height="66" rx="33" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8"/>
    <text x="697" y="607" text-anchor="middle" fill="#0F766E" font-size="13.5" font-weight="700">UC3.1: Vectorize Text via TF-IDF &amp; SVD</text>
    <text x="697" y="626" text-anchor="middle" fill="#14B8A6" font-size="11.5" font-weight="600">Extracts 50-D dense latent semantic vector (v_text)</text>
  </g>

  <!-- UC3.2: Predict Rate via KD-Tree IDW -->
  <g filter="url(#shadow)">
    <rect x="525" y="660" width="345" height="66" rx="33" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8"/>
    <text x="697" y="687" text-anchor="middle" fill="#0F766E" font-size="13.5" font-weight="700">UC3.2: Predict Rate via KD-Tree IDW</text>
    <text x="697" y="706" text-anchor="middle" fill="#14B8A6" font-size="11.5" font-weight="600">k=5 nearest historical peers (p=2 quadratic decay)</text>
  </g>

  <!-- UC3.3: Evaluate Domestic M-Pesa Tariffs -->
  <g filter="url(#shadow)">
    <rect x="525" y="740" width="345" height="66" rx="33" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.8"/>
    <text x="697" y="767" text-anchor="middle" fill="#0F766E" font-size="13.5" font-weight="700">UC3.3: Evaluate Domestic M-Pesa Tariffs</text>
    <text x="697" y="786" text-anchor="middle" fill="#14B8A6" font-size="11.5" font-weight="600">15-tier Safaricom P2P fee surcharge adjustment</text>
  </g>

  <!-- UC4: View Spatial Market Trend Analyses -->
  <g filter="url(#shadow)">
    <rect x="270" y="835" width="350" height="74" rx="37" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="445" y="868" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">UC4: View Market Trend Analyses</text>
    <text x="445" y="888" text-anchor="middle" fill="#64748B" font-size="12">Peer cluster dispersion &amp; [R_min, R_max] corridor</text>
  </g>


  <!-- ================= SYSTEM ADMINISTRATOR USE CASES (RIGHT SIDE) ================= -->

  <!-- UC5: Manage Firestore Repositories & Profiles -->
  <g filter="url(#shadow)">
    <rect x="710" y="205" width="360" height="74" rx="37" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="890" y="238" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">UC5: Manage Firestore Repositories</text>
    <text x="890" y="258" text-anchor="middle" fill="#64748B" font-size="12">Mentor profiles, service listings, &amp; reference indices</text>
  </g>

  <!-- UC6: Monitor API Throughput & Latency -->
  <g filter="url(#shadow)">
    <rect x="710" y="325" width="360" height="74" rx="37" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="890" y="358" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">UC6: Monitor API Throughput &amp; Latency</text>
    <text x="890" y="378" text-anchor="middle" fill="#64748B" font-size="12">FastAPI Prometheus telemetry &amp; &lt;15ms SLA metrics</text>
  </g>

  <!-- UC7: Trigger Offline Pipeline Retraining -->
  <g filter="url(#shadow)">
    <rect x="710" y="455" width="360" height="74" rx="37" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="890" y="488" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">UC7: Trigger Pipeline Retraining</text>
    <text x="890" y="508" text-anchor="middle" fill="#64748B" font-size="12">Re-fit SVD matrices, scalers &amp; domain KD-Trees</text>
  </g>

  <!-- UC8: Configure Hyperparameter Tuning -->
  <g filter="url(#shadow)">
    <rect x="710" y="835" width="360" height="74" rx="37" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="890" y="868" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">UC8: Configure Hyperparameters</text>
    <text x="890" y="888" text-anchor="middle" fill="#64748B" font-size="12">Update leaf size (40), k (5), &amp; damping alpha (0.50)</text>
  </g>

</svg>