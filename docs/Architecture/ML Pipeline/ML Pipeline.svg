<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" style="background:#FFFFFF; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-opacity="0.08" flood-color="#0F172A"/>
    </filter>

    <!-- Arrowhead Markers -->
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0D9488" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7C3AED" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#D97706" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="stage1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="stage2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="stage3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Canvas Outer Background -->
  <rect x="0" y="0" width="1400" height="980" fill="#F8FAFC" />

  <!-- Diagram Title Header -->
  <rect x="30" y="16" width="1340" height="54" rx="8" fill="url(#header-grad)" filter="url(#shadow)"/>
  <text x="50" y="50" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="0.5">Figure 4.8: Machine Learning Pipeline Runtime and Ingestion System Architecture</text>
  <text x="1350" y="50" text-anchor="end" fill="#94A3B8" font-size="13" font-weight="600">Strathmore University • Research Dissertation</text>


  <!-- ========================================================================= -->
  <!-- STAGE 1: OFFLINE INGESTION, TRAINING & PINNED SERIALIZATION (Y: 85 to 350)-->
  <!-- ========================================================================= -->
  <rect x="30" y="85" width="1340" height="270" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" filter="url(#shadow)"/>
  <path d="M 30 85 L 1370 85 L 1370 122 L 30 122 Z" fill="url(#stage1-grad)" rx="10" />
  <rect x="30" y="115" width="1340" height="7" fill="url(#stage1-grad)" />
  <text x="50" y="110" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">Stage 1: Offline Multi-Source Ingestion, Model Compilation &amp; SHA-256 Pinned Serialization</text>

  <!-- BOX 1A: Heterogeneous Secondary Data Sources (X: 45, Y: 135, W: 380, H: 205) -->
  <g filter="url(#shadow)">
    <rect x="45" y="135" width="380" height="205" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8"/>
    <rect x="45" y="135" width="380" height="38" rx="8" fill="#E2E8F0"/>
    <rect x="45" y="166" width="380" height="7" fill="#E2E8F0"/>
    <line x1="45" y1="173" x2="425" y2="173" stroke="#64748B" stroke-width="1"/>
    <text x="235" y="160" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">Offline Secondary Ingestion Sources</text>

    <text x="60" y="198" fill="#0F172A" font-size="13" font-weight="600">• Freelance Platform Listings (Upwork/Fiverr)</text>
    <text x="60" y="218" fill="#64748B" font-size="12">  Unstructured bios, skills narratives, quoted rates</text>

    <text x="60" y="242" fill="#0F172A" font-size="13" font-weight="600">• World Bank ICP Tables &amp; Numbeo Index</text>
    <text x="60" y="262" fill="#64748B" font-size="12">  Purchasing power parity factors &amp; living cost indices</text>

    <text x="60" y="286" fill="#0F172A" font-size="13" font-weight="600">• Safaricom Regulatory Tariff Schedules</text>
    <text x="60" y="306" fill="#64748B" font-size="12">  15-tier statutory domestic P2P transaction fees</text>

    <text x="60" y="328" fill="#059669" font-size="11.5" font-weight="700">ETL Reconciliation: Base KES Normalization &amp; IQR Filtering</text>
  </g>

  <!-- Connector: Sources -> Training Pipeline -->
  <line x1="425" y1="237" x2="475" y2="237" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-gray)"/>
  <rect x="428" y="215" width="46" height="20" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
  <text x="451" y="229" text-anchor="middle" fill="#475569" font-size="10.5" font-weight="700">ETL</text>

  <!-- BOX 1B: Model Compilation Pipeline (X: 475, Y: 135, W: 450, H: 205) -->
  <g filter="url(#shadow)">
    <rect x="475" y="135" width="450" height="205" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8"/>
    <rect x="475" y="135" width="450" height="38" rx="8" fill="#E2E8F0"/>
    <rect x="475" y="166" width="450" height="7" fill="#E2E8F0"/>
    <line x1="475" y1="173" x2="925" y2="173" stroke="#64748B" stroke-width="1"/>
    <text x="700" y="160" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">Training Pipeline &amp; Model Compiler</text>

    <text x="490" y="198" fill="#0F172A" font-size="13" font-weight="600">1. Out-of-Time (OOT) Chronological Split</text>
    <text x="490" y="218" fill="#64748B" font-size="12">   70% Train, 15% Validation, 15% Test (zero lookahead bias)</text>

    <text x="490" y="242" fill="#0F172A" font-size="13" font-weight="600">2. Lexical &amp; Metadata Transformer Fitting</text>
    <text x="490" y="262" fill="#64748B" font-size="12">   TF-IDF (12K max) + Truncated SVD (50D) • Min-Max Scaler (3D)</text>

    <text x="490" y="286" fill="#0F172A" font-size="13" font-weight="600">3. Spatial KD-Tree Domain Stratification</text>
    <text x="490" y="306" fill="#64748B" font-size="12">   Segregated categorical trees (leaf_size=40, Minkowski metric)</text>

    <text x="490" y="328" fill="#059669" font-size="11.5" font-weight="700">Audit Compliance: R² ≥ 0.65 threshold &amp; diagnostic logging</text>
  </g>

  <!-- Connector: Compiler -> Serialized Storage -->
  <line x1="925" y1="237" x2="975" y2="237" stroke="#475569" stroke-width="2.2" marker-end="url(#arr-gray)"/>
  <rect x="928" y="215" width="46" height="20" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="1"/>
  <text x="951" y="229" text-anchor="middle" fill="#475569" font-size="10.5" font-weight="700">Build</text>

  <!-- BOX 1C: Serialized Pinned Storage (X: 975, Y: 135, W: 380, H: 205) -->
  <g filter="url(#shadow)">
    <rect x="975" y="135" width="380" height="205" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8"/>
    <rect x="975" y="135" width="380" height="38" rx="8" fill="#E2E8F0"/>
    <rect x="975" y="166" width="380" height="7" fill="#E2E8F0"/>
    <line x1="975" y1="173" x2="1355" y2="173" stroke="#64748B" stroke-width="1"/>
    <text x="1165" y="160" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="700">Serialized Artifact Storage (/artifacts)</text>

    <text x="990" y="198" fill="#0F172A" font-size="13" font-weight="600">• tfidf_svd_pipeline.joblib</text>
    <text x="990" y="218" fill="#64748B" font-size="12">  Fitted vocabulary, IDF weights &amp; SVD projection matrix</text>

    <text x="990" y="242" fill="#0F172A" font-size="13" font-weight="600">• metadata_scaler.joblib</text>
    <text x="990" y="262" fill="#64748B" font-size="12">  PPP damping α=0.50 &amp; continuous bounds</text>

    <text x="990" y="286" fill="#0F172A" font-size="13" font-weight="600">• domain_kdtree_index.joblib</text>
    <text x="990" y="306" fill="#64748B" font-size="12">  Stratified 53-D KD-Trees keyed by industry_id</text>

    <text x="990" y="328" fill="#B91C1C" font-size="11.5" font-weight="700">Security Invariant: SHA-256 Checksum Pinned Verification</text>
  </g>


  <!-- ========================================================================= -->
  <!-- STAGE 2: ONLINE INGRESS GATEWAY & RESIDENT RAM RUNTIME (Y: 385 to 765)    -->
  <!-- ========================================================================= -->
  <rect x="30" y="385" width="1340" height="380" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" filter="url(#shadow)"/>
  <path d="M 30 385 L 1370 385 L 1370 422 L 30 422 Z" fill="url(#stage2-grad)" rx="10" />
  <rect x="30" y="415" width="1340" height="7" fill="url(#stage2-grad)" />
  <text x="50" y="410" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">Stage 2: Client Ingress Gateway &amp; High-Throughput Memory-Resident Analytical Runtime</text>

  <!-- BOX 2A: Client Ingress (X: 45, Y: 435, W: 310, H: 315) -->
  <g filter="url(#shadow)">
    <rect x="45" y="435" width="310" height="315" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
    <rect x="45" y="435" width="310" height="38" rx="8" fill="#DBEAFE"/>
    <rect x="45" y="466" width="310" height="7" fill="#DBEAFE"/>
    <line x1="45" y1="473" x2="355" y2="473" stroke="#3B82F6" stroke-width="1"/>
    <text x="200" y="460" text-anchor="middle" fill="#1E40AF" font-size="14.5" font-weight="700">Client Ingress Layer</text>

    <text x="60" y="500" fill="#0F172A" font-size="13" font-weight="700">Native Android Client (Kotlin)</text>
    <text x="60" y="520" fill="#64748B" font-size="12">Jetpack Compose UI • StateFlow VM</text>

    <text x="60" y="550" fill="#0F172A" font-size="13" font-weight="700">HTTPS / TLS 1.3 Ingress</text>
    <text x="60" y="570" fill="#2563EB" font-size="12" font-family="'Consolas', monospace">POST /api/v1/optimize-price</text>

    <text x="60" y="602" fill="#0F172A" font-size="13" font-weight="700">Zero-Trust Authentication</text>
    <text x="60" y="622" fill="#64748B" font-size="12">Firebase RS256 Bearer Token</text>
    <text x="60" y="638" fill="#64748B" font-size="12">Validated via Google JWKS per-call</text>

    <text x="60" y="670" fill="#0F172A" font-size="13" font-weight="700">Payload Sanitization</text>
    <text x="60" y="690" fill="#64748B" font-size="12">Pydantic V2 PricingQueryDTO</text>
    <text x="60" y="706" fill="#64748B" font-size="12">Bounds: bio [20..2000], sat [0..1]</text>

    <text x="60" y="736" fill="#059669" font-size="11.5" font-weight="700">Security: Fails closed on invalid JWT</text>
  </g>

  <!-- Connector: Client -> In-Memory Runtime -->
  <line x1="355" y1="592" x2="395" y2="592" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <rect x="345" y="565" width="70" height="22" rx="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="380" y="580" text-anchor="middle" fill="#2563EB" font-size="11" font-weight="700">JSON DTO</text>

  <!-- BOX 2B: FastAPI In-Memory ML Runtime (X: 395, Y: 435, W: 960, H: 315) -->
  <g filter="url(#shadow)">
    <rect x="395" y="435" width="960" height="315" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="395" y="435" width="960" height="38" rx="8" fill="#EFF6FF"/>
    <rect x="395" y="466" width="960" height="7" fill="#EFF6FF"/>
    <line x1="395" y1="473" x2="1355" y2="473" stroke="#2563EB" stroke-width="1.2"/>
    <text x="415" y="460" fill="#1E40AF" font-size="14.5" font-weight="800">In-Memory Analytical ML Runtime (FastAPI / Uvicorn ASGI Worker Core)</text>
    <text x="1340" y="460" text-anchor="end" fill="#059669" font-size="13" font-weight="800">SLA: &lt; 15 ms CPU Execution Budget</text>

    <!-- Sub-module 1: Startup Artifact Hydration (Y: 485) -->
    <rect x="415" y="485" width="920" height="52" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.2"/>
    <text x="430" y="506" fill="#0F766E" font-size="13.5" font-weight="700">1. Startup Checksum Verification &amp; Resident RAM Hydration (@app.on_event("startup"))</text>
    <text x="430" y="525" fill="#134E4A" font-size="12">Computes SHA-256 digests over .joblib files; hydrates SVD matrices &amp; domain KD-Trees into RAM to eliminate disk I/O.</text>

    <!-- Sub-module 2: In-Memory Feature Pipeline (Y: 545) -->
    <rect x="415" y="545" width="920" height="64" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
    <text x="430" y="567" fill="#0F172A" font-size="13.5" font-weight="700">2. Latent Projection &amp; Continuous Metadata Scaling Core</text>
    <text x="430" y="587" fill="#475569" font-size="12">• TF-IDF &amp; SVD: Projects bio narrative into dense 50-D semantic space (v_text ∈ ℝ⁵⁰)</text>
    <text x="430" y="602" fill="#475569" font-size="12">• Bilateral Arbitrage Scaler: Evaluates Φ_m→c = (PPP_c / PPP_m)^0.50 × (COL_m / COL_c)^0.50 &amp; saturation (v_meta ∈ [0,1]³)</text>

    <!-- Sub-module 3: Coordinate Fusion & Domain KD-Tree IDW (Y: 617) -->
    <rect x="415" y="617" width="920" height="64" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="430" y="639" fill="#5B21B6" font-size="13.5" font-weight="700">3. 53-D Coordinate Fusion &amp; Domain-Stratified KD-Tree Query (O(log N) Retrieval)</text>
    <text x="430" y="659" fill="#6B21A8" font-size="12">• Fusion Vector: q = [v_text ; ω_meta · v_meta] ∈ ℝ⁵³ Residing in Euclidean metric space</text>
    <text x="430" y="674" fill="#6B21A8" font-size="12">• Spatial IDW Regression: Traverses industry KD-Tree, retrieves k=5 peers, computes y_base = ∑ w_i y_i / ∑ w_i (p=2, ε=10⁻⁶)</text>

    <!-- Sub-module 4: M-Pesa Tariff Adjustment (Y: 689) -->
    <rect x="415" y="689" width="920" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="430" y="710" fill="#78350F" font-size="13.5" font-weight="700">4. Statutory Safaricom M-Pesa Fee Evaluation &amp; Rate Corridor Derivation</text>
    <text x="430" y="728" fill="#92400E" font-size="12">If domestic KE-&gt;KE: Appends 15-tier fee surcharge. Corridor: [R_min, R_max] derived from peer standard error &amp; wage floor.</text>
  </g>

  <!-- Downward Startup Hydration Connector: Stage 1 Storage -> Stage 2 Startup Loader -->
  <path d="M 1165 340 L 1165 485" fill="none" stroke="#B91C1C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-teal)"/>
  <rect x="1100" y="390" width="130" height="22" rx="4" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.2"/>
  <text x="1165" y="405" text-anchor="middle" fill="#B91C1C" font-size="11" font-weight="700">Startup RAM Hydration</text>


  <!-- ========================================================================= -->
  <!-- STAGE 3: PERSISTENCE, TELEMETRY & MLOps AUDITING (Y: 795 to 950)          -->
  <!-- ========================================================================= -->
  <rect x="30" y="795" width="1340" height="165" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" filter="url(#shadow)"/>
  <path d="M 30 795 L 1370 795 L 1370 832 L 30 832 Z" fill="url(#stage3-grad)" rx="10" />
  <rect x="30" y="825" width="1340" height="7" fill="url(#stage3-grad)" />
  <text x="50" y="820" fill="#FFFFFF" font-size="15" font-weight="700" letter-spacing="0.5">Stage 3: Cloud Infrastructure Boundaries &amp; Google Cloud Firestore Persistence</text>

  <!-- Left: Async Non-Blocking Telemetry Write -->
  <rect x="45" y="845" width="640" height="100" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="60" y="870" fill="#4C1D95" font-size="14" font-weight="700">Asynchronous MLOps Telemetry Logging (FastAPI BackgroundTasks)</text>
  <text x="60" y="892" fill="#0F172A" font-size="12.5" font-family="'Consolas', monospace">Target: /pricing_audits • Non-blocking fire-and-forget worker pool</text>
  <text x="60" y="912" fill="#64748B" font-size="12">Records raw input payload, 53-D coordinate array, k=5 peer IDs, quoted corridor &amp; timestamp.</text>
  <text x="60" y="932" fill="#059669" font-size="11.5" font-weight="700">Invariant: Telemetry writes occur off the critical path, preserving &lt;15ms user-facing SLA.</text>

  <!-- Right: In-Memory Read Caching of Statutory Collections -->
  <rect x="715" y="845" width="640" height="100" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="730" y="870" fill="#065F46" font-size="14" font-weight="700">Statutory Lookups &amp; Reference Caches (Cloud Firestore NoSQL)</text>
  <text x="730" y="892" fill="#0F172A" font-size="12.5" font-family="'Consolas', monospace">Collections: /macro_indices • /industry_partitions • /mpesa_tariffs</text>
  <text x="730" y="912" fill="#64748B" font-size="12">Pre-warmed in FastAPI memory cache on startup; invalidated periodically via 1-hour TTL.</text>
  <text x="730" y="932" fill="#2563EB" font-size="11.5" font-weight="700">Zero database connection bottleneck during live inference requests.</text>

  <!-- Connectors: Stage 2 -> Stage 3 -->
  <!-- Async Audit Telemetry Connector -->
  <path d="M 680 750 L 680 845" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arr-purple)"/>
  <rect x="615" y="775" width="130" height="22" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="680" y="790" text-anchor="middle" fill="#7C3AED" font-size="11" font-weight="700">Async Telemetry Log</text>

  <!-- Sync Return Connector back to Client -->
  <path d="M 395 680 L 200 680 L 200 750" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="235" y="668" width="125" height="22" rx="4" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
  <text x="297" y="683" text-anchor="middle" fill="#059669" font-size="11" font-weight="800">HTTP 200 PredictionDTO</text>

</svg>